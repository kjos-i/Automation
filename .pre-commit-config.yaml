# Checks that run at every `git commit`, so a mistake is caught locally rather
# than on GitHub. Mirrors Epistemon's, so both repos behave the same way.
#
# One-time setup after cloning:
#     pip install -e ".[dev]"
#     pre-commit install        # writes .git/hooks/pre-commit
#
# The install step is the part that is easy to forget, and a config without it
# does nothing at all.
#
# The secret scan here guards the REPO. `tools/build.py` has its own check that
# guards the INSTALLER, searching the assembled folder for real values from
# .env. Two different artefacts, so two checks.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      # The same lint and formatter run by hand; rules live in pyproject.toml
      # so there is one source of truth.
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      # The screenshot in images/ is the only large file that belongs here, and
      # it is well under this. A build artefact wandering in would not be.
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      # An accidentally committed private key, SSH or PEM. No baseline needed.
      - id: detect-private-key

  # Blocks a commit that adds an API key, token, password or .env-style secret.
  # A false positive can be marked with `# pragma: allowlist secret` on the
  # line, or recorded with `detect-secrets audit .secrets.baseline`.
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
